hooks:
  before_specify:
    - extension: "local"
      command: "speckit.branch.create"
      description: "Crea la rama de git para la nueva feature. Siempre parte de develop/main/master, salvo relación explícita con la spec de la rama actual."
      optional: false
      enabled: true
  after_converge:
    - extension: "local"
      command: "planet.finish.spec"
      description: "Cierra la spec ya convergida: front matter a 'Implemented', marca specs_pending/ como hecha, y cierra la feature fusionándola con --no-ff en develop y master (sin proceso de release aparte)."
      optional: true
      enabled: true
